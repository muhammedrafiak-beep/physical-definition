<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PD Mirror — 3D model driven by camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070A; --panel:#0B0F14; --gold:#E0A94A; --gold-dim:rgba(224,169,74,.5);
    --ink:#EDF3F8; --ink3:rgba(237,243,248,.32); --ink2:rgba(237,243,248,.55);
    --rule:rgba(224,169,74,.14);
    --disp:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 30px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--gold-dim)}

  .stage{position:relative;width:min(94vw,420px);aspect-ratio:9/16;border-radius:24px;overflow:hidden;
    background-color:#05070A;box-shadow:0 0 0 1px rgba(224,169,74,.11),0 30px 80px -26px #000;
    touch-action:none}
  #three{display:block;width:100%;height:100%;cursor:grab}
  #three:active{cursor:grabbing}

  .hud{position:absolute;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ttl .k{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.22em;color:var(--gold);margin-bottom:2px;text-transform:uppercase}
  .ttl .v{font-family:var(--disp);font-size:24px;font-weight:700;line-height:.92;text-transform:uppercase}
  .status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{padding:5px 10px;border-radius:99px;border:1px solid var(--rule);font-size:10.5px;
    font-family:var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
    background:rgba(5,7,10,.55);backdrop-filter:blur(6px)}
  .pill.ok{color:#34E5A0;border-color:rgba(52,229,160,.35)}
  .pill.warn{color:var(--gold);border-color:rgba(224,169,74,.42)}

  .bottom{display:flex;justify-content:space-between;align-items:flex-end}
  .depth .n{font-family:var(--disp);font-size:38px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}
  .depth .l{font-family:var(--disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
  .hint{font-size:10.5px;color:var(--ink3)}

  #pip{position:absolute;width:104px;height:104px;border-radius:14px;overflow:hidden;
    border:1px solid var(--rule);background:#070A0E;box-shadow:0 10px 26px -10px #000;
    touch-action:none;z-index:6}
  #pip video,#pip canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #pip .tag{position:absolute;top:5px;left:7px;z-index:3;font-family:var(--disp);font-size:8.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--gold);pointer-events:none}
  #pip .grip{position:absolute;right:2px;bottom:2px;width:16px;height:16px;z-index:4;cursor:nwse-resize;
    background:radial-gradient(circle at 70% 70%,rgba(224,169,74,.55),transparent 60%)}
  #pip .drag{position:absolute;inset:0;z-index:2;cursor:grab}

  .bar{width:min(94vw,420px);background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bar b{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--gold)}
  button.chip{padding:8px 13px;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--ink);
    font-family:var(--disp);letter-spacing:.12em;text-transform:uppercase;font-size:11px;cursor:pointer}
  button.chip.on{background:rgba(224,169,74,.12);border-color:rgba(224,169,74,.45)}
  #log{width:min(94vw,420px);font-family:ui-monospace,monospace;font-size:10px;color:var(--ink3);
    background:#080B0F;border:1px solid var(--rule);border-radius:12px;padding:9px 11px;
    max-height:100px;overflow:auto;white-space:pre-wrap;display:none}
  .foot{max-width:420px;font-size:11.5px;line-height:1.55;color:var(--ink3);text-align:center}
  .foot b{color:var(--ink2);font-weight:500}
</style>
</head>
<body>

<div class="eyebrow">Physical Definition · PD Mirror</div>

<div class="stage" id="stage">
  <canvas id="three"></canvas>
  <div class="hud">
    <div class="top">
      <div class="ttl"><span class="k">Station 1</span><span class="v">Squat</span></div>
      <div class="status">
        <span class="pill" id="st">starting…</span>
      </div>
    </div>
    <div class="bottom">
      <div class="depth"><div class="n" id="pv">0</div><div class="l">Depth</div></div>
      <div class="hint" id="orbitDbg">yaw 0° / pitch 0°</div>
    </div>
  </div>
  <div id="pip">
    <span class="tag">You</span>
    <video id="video" playsinline muted></video>
    <canvas id="camCanvas"></canvas>
    <div class="drag" id="pipDrag"></div>
    <div class="grip" id="pipGrip"></div>
  </div>
</div>

<div class="bar">
  <b>Controls</b>
  <button class="chip on" id="mirror">Mirror on</button>
  <button class="chip" id="showLog">Bone log</button>
  <button class="chip" id="resetPip">Reset camera box</button>
</div>

<div id="log"></div>

<p class="foot">The model is driven live by your joints — <b>drag it to look from any angle</b>, and drag or resize the small camera box to wherever suits you. Sync can't drift: the pose <b>is</b> the model.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
const $=i=>document.getElementById(i);
const stage=$('stage'), logEl=$('log'), stEl=$('st'), pvEl=$('pv');
function log(s){logEl.textContent=s;}

let scene,camera,renderer,model,skeletonReady=false;
const canvas3=$('three');

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(30,9/16,0.1,100);
renderer=new THREE.WebGLRenderer({canvas:canvas3,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

scene.add(new THREE.HemisphereLight(0x8fa6bd,0x0a0d12,0.7));
const kl=new THREE.DirectionalLight(0xfff3e6,1.2); kl.position.set(2.2,3.6,3.0); scene.add(kl);
const rl=new THREE.DirectionalLight(0xE0A94A,1.4);  rl.position.set(-2.6,2.2,-2.4); scene.add(rl);

const pad=new THREE.Mesh(new THREE.CircleGeometry(1.1,48),
  new THREE.MeshStandardMaterial({color:0x080b10,roughness:.9}));
pad.rotation.x=-Math.PI/2; scene.add(pad);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.07,1.095,48),
  new THREE.MeshBasicMaterial({color:0xE0A94A,transparent:true,opacity:.25,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.001; scene.add(ring);

function fitStage(){
  const r=stage.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  camera.aspect=r.width/r.height; camera.updateProjectionMatrix();
}
addEventListener('resize',fitStage);

let yaw=0.05, pitch=0.02, dist=4.6, orbitTarget=0.95, dragging=false, lx=0, ly=0, dragId=null;
function updateCam(){
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist, orbitTarget+Math.sin(pitch)*dist, Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0,orbitTarget,0);
}
canvas3.style.touchAction='none';
canvas3.addEventListener('pointerdown',function(e){
  dragging=true; dragId=e.pointerId; lx=e.clientX; ly=e.clientY;
  try{canvas3.setPointerCapture(e.pointerId);}catch(err){}
});
canvas3.addEventListener('pointermove',function(e){
  if(!dragging||e.pointerId!==dragId) return;
  yaw+=(e.clientX-lx)*0.011; pitch=Math.max(-0.35,Math.min(0.55,pitch-(e.clientY-ly)*0.007));
  lx=e.clientX; ly=e.clientY;
});
function endDrag(e){ if(e.pointerId===dragId){ dragging=false; dragId=null; } }
canvas3.addEventListener('pointerup',endDrag);
canvas3.addEventListener('pointercancel',endDrag);
canvas3.addEventListener('lostpointercapture',function(){dragging=false;dragId=null;});

const BONES={}, REST={}, allBones=[];
const AIM={
  lUpLeg:[23,25], lLeg:[25,27],
  rUpLeg:[24,26], rLeg:[26,28],
  lArm:[11,13],   lForeArm:[13,15],
  rArm:[12,14],   rForeArm:[14,16]
};
function roleFor(rawName){
  const n=rawName.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(n.includes('hips')||n.includes('pelvis')) return 'hips';
  if(n.includes('spine2')||n.includes('chest')) return 'chest';
  if(n.includes('spine')) return 'spine';
  if(n.includes('neck')) return 'neck';
  if(n.includes('head')) return 'head';
  if(n.includes('leftupleg')||n.includes('leftthigh')) return 'lUpLeg';
  if(n.includes('leftleg')||n.includes('leftshin')||n.includes('leftcalf')) return 'lLeg';
  if(n.includes('leftfoot')) return 'lFoot';
  if(n.includes('rightupleg')||n.includes('rightthigh')) return 'rUpLeg';
  if(n.includes('rightleg')||n.includes('rightshin')||n.includes('rightcalf')) return 'rLeg';
  if(n.includes('rightfoot')) return 'rFoot';
  if(n.includes('leftforearm')||n.includes('leftlowerarm')) return 'lForeArm';
  if(n.includes('leftarm')) return 'lArm';
  if(n.includes('rightforearm')||n.includes('rightlowerarm')) return 'rForeArm';
  if(n.includes('rightarm')) return 'rArm';
  return null;
}
function mapBones(root){
  root.traverse(o=>{ if(o.isBone) allBones.push(o); });
  allBones.forEach(b=>{
    const role=roleFor(b.name);
    if(role && !BONES[role]) BONES[role]=b;
  });
  root.updateMatrixWorld(true);
  Object.keys(AIM).forEach(role=>{
    const b=BONES[role]; if(!b) return;
    const child=b.children.find(c=>c.isBone);
    if(!child) { delete BONES[role]; return; }
    const bw=new THREE.Vector3(), cw=new THREE.Vector3(), qw=new THREE.Quaternion();
    b.getWorldPosition(bw); child.getWorldPosition(cw); b.getWorldQuaternion(qw);
    REST[role]={q:qw.clone(), dir:cw.sub(bw).normalize(), bone:b};
  });
  const found=Object.keys(AIM).filter(r=>BONES[r]);
  const missing=Object.keys(AIM).filter(r=>!BONES[r]);
  log('bones total: '+allBones.length+
      '\nmapped: '+found.join(', ')+
      (missing.length?'\nMISSING: '+missing.join(', '):'\nall limb bones mapped')+
      '\n\nfirst 20 names: '+allBones.slice(0,20).map(b=>b.name).join(', '));
  skeletonReady=found.length>=4;
}

new THREE.GLTFLoader().load(
  '/models/pd-figure.glb',
  gltf=>{
    model=gltf.scene;
    model.traverse(o=>{ if(o.isMesh){o.frustumCulled=false;} });
    scene.add(model);
    mapBones(model);

    const box=new THREE.Box3().setFromObject(model);
    const size=new THREE.Vector3(); box.getSize(size);
    const center=new THREE.Vector3(); box.getCenter(center);
    const targetHeight=1.72;
    const s=targetHeight/(size.y||1);
    model.scale.setScalar(s);
    model.position.set(-center.x*s, -box.min.y*s, -center.z*s);
    orbitTarget=targetHeight*0.56;
    dist=targetHeight*1.55;
    fitStage(); updateCam();
    log(logEl.textContent+'\n\nmodel height was '+size.y.toFixed(2)+' units, rescaled by '+s.toFixed(3));
  },
  undefined,
  err=>{ log('model load failed: '+err); }
);

const qDelta=new THREE.Quaternion(), qWorld=new THREE.Quaternion(),
      qParent=new THREE.Quaternion(), qOut=new THREE.Quaternion();
const vA=new THREE.Vector3(), vB=new THREE.Vector3(), vDir=new THREE.Vector3();
let mirror=true;
const SMOOTH=0.16;

function lm3(L,i){ const p=L[i]; return vDir.set((mirror?-p.x:p.x), -p.y, -p.z); }
function aim(role,L){
  const b=BONES[role], rest=REST[role]; if(!b||!rest) return;
  const io=AIM[role], i0=io[0], i1=io[1];
  if(!L[i0]||!L[i1]) return;
  vA.copy(lm3(L,i0)); vB.copy(lm3(L,i1));
  vDir.subVectors(vB,vA);
  if(vDir.lengthSq()<1e-8) return;
  vDir.normalize();
  qDelta.setFromUnitVectors(rest.dir,vDir);
  qWorld.copy(qDelta).multiply(rest.q);
  if(b.parent){ b.parent.getWorldQuaternion(qParent); qParent.invert(); qOut.copy(qParent).multiply(qWorld); }
  else qOut.copy(qWorld);
  b.quaternion.slerp(qOut,SMOOTH);
  b.updateMatrixWorld(true);
}
const ORDER=['lUpLeg','lLeg','rUpLeg','rLeg','lArm','lForeArm','rArm','rForeArm'];
function retarget(L){ if(!skeletonReady) return; ORDER.forEach(r=>aim(r,L)); }

const video=$('video'), pipCanvas=$('camCanvas'), cx=pipCanvas.getContext('2d');

function drawCam(res){
  const r=pipCanvas.getBoundingClientRect();
  const w=Math.max(1,Math.floor(r.width)), h=Math.max(1,Math.floor(r.height));
  if(pipCanvas.width!==w||pipCanvas.height!==h){ pipCanvas.width=w; pipCanvas.height=h; }
  const iw=res.image.width, ih=res.image.height;
  const s=Math.max(w/iw, h/ih);
  const dw=iw*s, dh=ih*s, dx=(w-dw)/2, dy=(h-dh)/2;
  cx.save(); cx.clearRect(0,0,w,h);
  if(mirror){ cx.translate(w,0); cx.scale(-1,1); }
  cx.filter='brightness(.6) saturate(.75)';
  cx.drawImage(res.image,dx,dy,dw,dh);
  cx.filter='none';
  if(res.poseLandmarks){
    const pts=res.poseLandmarks.map(p=>({x:dx/w+p.x*dw/w, y:dy/h+p.y*dh/h, visibility:p.visibility}));
    drawConnectors(cx,pts,POSE_CONNECTIONS,{color:'#7DE2FF',lineWidth:2});
    drawLandmarks(cx,pts,{color:'#EAF9FF',lineWidth:1,radius:1.6});
  }
  cx.restore();
}

function depthOf(L){
  const hip=(L[23].y+L[24].y)/2, knee=(L[25].y+L[26].y)/2, ank=(L[27].y+L[28].y)/2;
  const shin=Math.max(0.03, ank-knee);
  const r=(ank-hip)/shin;
  return Math.min(1,Math.max(0,(2.0-r)/0.85));
}

function onResults(res){
  drawCam(res);
  const L=res.poseLandmarks, W=res.poseWorldLandmarks;
  if(!L){ stEl.textContent='no body'; stEl.className='pill'; return; }
  const keys=[11,12,23,24,25,26,27,28];
  const vs=keys.map(i=>L[i]?.visibility??0);
  const avg=vs.reduce(function(a,b){return a+b;},0)/vs.length, lo=Math.min.apply(null,vs);
  const feet=L[27].y<0.97&&L[28].y<0.97;
  if(avg<0.6||lo<0.2||!feet){ stEl.textContent='step back — full body'; stEl.className='pill warn'; return; }
  stEl.textContent=skeletonReady?'tracking':'model not mapped'; stEl.className='pill ok';
  pvEl.textContent=Math.round(depthOf(L)*100);
  if(W) retarget(W);
}

const pose=new Pose({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f;}});
pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,
  minDetectionConfidence:0.5,minTrackingConfidence:0.5});
pose.onResults(onResults);

setTimeout(function(){
  const mp=new Camera(video,{onFrame:async function(){await pose.send({image:video});},width:640,height:480});
  mp.start().catch(function(e){stEl.textContent='camera blocked'; stEl.className='pill warn'; log('camera: '+e);});
},120);

const pip=$('pip'), pipDrag=$('pipDrag'), pipGrip=$('pipGrip');
function placePipDefault(){
  const r=stage.getBoundingClientRect();
  pip.style.width='104px'; pip.style.height='104px';
  pip.style.left=(r.width-104-12)+'px'; pip.style.top='12px';
}
let mode=null, sx=0, sy=0, ox=0, oy=0, ow=0, oh=0, pipId=null;
function stageRect(){ return stage.getBoundingClientRect(); }
function clampPip(){
  const r=stageRect(), pr=pip.getBoundingClientRect();
  let left=parseFloat(pip.style.left), top=parseFloat(pip.style.top);
  left=Math.max(4,Math.min(r.width-pr.width-4,left));
  top=Math.max(4,Math.min(r.height-pr.height-4,top));
  pip.style.left=left+'px'; pip.style.top=top+'px';
}
pipDrag.style.touchAction='none'; pipGrip.style.touchAction='none';
pipDrag.addEventListener('pointerdown',function(e){
  mode='move'; pipId=e.pointerId; sx=e.clientX; sy=e.clientY;
  ox=parseFloat(pip.style.left); oy=parseFloat(pip.style.top);
  try{pipDrag.setPointerCapture(e.pointerId);}catch(err){}
  e.stopPropagation();
});
pipGrip.addEventListener('pointerdown',function(e){
  mode='resize'; pipId=e.pointerId; sx=e.clientX; sy=e.clientY;
  ow=pip.offsetWidth; oh=pip.offsetHeight;
  try{pipGrip.setPointerCapture(e.pointerId);}catch(err){}
  e.stopPropagation();
});
function pipMove(e){
  if(!mode||e.pointerId!==pipId) return;
  if(mode==='move'){ pip.style.left=(ox+e.clientX-sx)+'px'; pip.style.top=(oy+e.clientY-sy)+'px'; clampPip(); }
  else{ const d=Math.max(e.clientX-sx,e.clientY-sy); const size=Math.max(72,Math.min(220,ow+d));
        pip.style.width=size+'px'; pip.style.height=size+'px'; clampPip(); }
}
function pipEnd(e){ if(e.pointerId===pipId){ mode=null; pipId=null; } }
pipDrag.addEventListener('pointermove',pipMove); pipGrip.addEventListener('pointermove',pipMove);
pipDrag.addEventListener('pointerup',pipEnd); pipGrip.addEventListener('pointerup',pipEnd);
pipDrag.addEventListener('pointercancel',pipEnd); pipGrip.addEventListener('pointercancel',pipEnd);


$('mirror').onclick=function(){mirror=!mirror; $('mirror').textContent='Mirror '+(mirror?'on':'off'); $('mirror').classList.toggle('on',mirror);};
$('showLog').onclick=function(){const v=logEl.style.display==='block'; logEl.style.display=v?'none':'block'; $('showLog').classList.toggle('on',!v);};
$('resetPip').onclick=placePipDefault;

fitStage(); placePipDefault(); updateCam();
(function loop(){ requestAnimationFrame(loop); updateCam();
  const dbg=document.getElementById('orbitDbg');
  if(dbg) dbg.textContent='yaw '+Math.round(yaw*57.3)+'° / pitch '+Math.round(pitch*57.3)+'° / drag:'+(dragging?'Y':'N');
  renderer.render(scene,camera); })();
</script>
</body>
</html>
